name: Daily Reel Pipeline

on:
  schedule:
    # Runs at 12:00 PM UTC every day
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Run mode (preview or publish)'
        required: true
        default: 'preview'
      debug_mode:
        description: 'Preserve artifacts and rich JSON data'
        required: true
        default: 'true'
        type: boolean
      watermark_enabled:
        description: 'Add watermark to the reel'
        required: true
        default: 'true'
        type: boolean
      force_quote_id:
        description: 'Specific quote ID to generate (optional)'
        required: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Edge-TTS
        run: pip install edge-tts

      - name: Install FFmpeg and Fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - name: Setup Whisper.cpp and Download Model
        run: |
          mkdir -p bin/whisper models
          # Download whisper model
          wget -q https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin -O models/ggml-base.en.bin
          
          # Clone and build whisper.cpp
          git clone https://github.com/ggerganov/whisper.cpp.git /tmp/whisper
          cd /tmp/whisper
          git checkout v1.6.2
          make
          # Copy the compiled binary
          cp main $GITHUB_WORKSPACE/bin/whisper/main

      - name: Install dependencies
        run: npm ci

      - name: Run Pipeline (Generate Reel)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CREDS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          WHISPER_ENABLED: 'true'
          RUN_MODE: ${{ github.event.inputs.run_mode || 'publish' }}
          DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
          WATERMARK_ENABLED: ${{ github.event.inputs.watermark_enabled || 'true' }}
          TEST_QUOTE_ID: ${{ github.event.inputs.force_quote_id || '' }}
        run: |
          # Write Firebase credentials from secret safely to preserve JSON quotes
          printf "%s\n" "$FIREBASE_CREDS" > firebase-adminsdk.json
          export GOOGLE_APPLICATION_CREDENTIALS=./firebase-adminsdk.json
          
          # Generate Reel
          npm run test:reel

      - name: Archive artifacts (Debug Mode)
        if: ${{ github.event.inputs.debug_mode == 'true' || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: reel-artifacts
          path: |
            output/
            temp/
          retention-days: 7

      - name: Run Publish
        if: ${{ github.event.inputs.run_mode == 'publish' || github.event_name == 'schedule' }}
        env:
          ENABLE_PUBLISHING: 'true'
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
        run: |
          npm run test:publish
